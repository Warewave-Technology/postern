# Geçerli örnek config — yalnızca ALTYAPI alanları (S3 sözleşmesi):
# burayı değiştirirsen TestLoadValidFields'ı da güncelle.
#
# Göreli yollar bu dosyanın bulunduğu dizine göre çözülür (Load sözleşmesi).
listen:
   addr: ":2222"

host_key: keys/host_ed25519

ca:
  key_file: keys/ca_ed25519

database:
   dsn: postgres://postern:postern@localhost:5432/postern?sslmode=disable

recording:
   dir: recordings
   # record_input bilinçli olarak yazılmadı: varsayılan false kalmalı.

