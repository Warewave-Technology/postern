# postern hızlı başlangıcı: bastion + veritabanı + iki hedef makine.
#
# ⚠️ BU DOSYA ÜRETİM İÇİN DEĞİL. Parolalar .env'den geliyor ve
# quickstart.sh onları her kurulumda yeniden üretiyor; veritabanı dışarı
# hiç açılmıyor; TLS yok, çünkü her şey loopback'te duruyor.
name: postern-quickstart

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postern
      POSTGRES_PASSWORD: ${POSTERN_DB_PASSWORD:?quickstart.sh tarafından üretilir}
      POSTGRES_DB: postern
    # ⚠️ PORT YAYINLANMIYOR. Panelin ve bastion'ın dışında kimsenin
    # veritabanına ulaşması gerekmiyor; yayınlamak, denemek isteyen
    # birinin makinesinde açık bir Postgres bırakmak olurdu.
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postern -d postern"]
      interval: 2s
      timeout: 3s
      retries: 30

  postern:
    build:
      context: ../..
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTERN_DATABASE_DSN: "postgres://postern:${POSTERN_DB_PASSWORD:?quickstart.sh tarafından üretilir}@db:5432/postern?sslmode=disable"
    volumes:
      - ./.state:/var/lib/postern
      - ./postern.yaml:/etc/postern/postern.yaml:ro
    ports:
      # Panel ve SSH yalnızca loopback'e bağlanıyor: hızlı başlangıç
      # kuran kişinin makinesi ağa açılmasın.
      - "127.0.0.1:${POSTERN_HTTP_PORT:-8088}:8088"
      - "127.0.0.1:${POSTERN_SSH_PORT:-2222}:2222"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8088/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30

  demo-a:
    build: ./target
    volumes:
      - ./.state/keys/ca_ed25519.pub:/etc/ssh/postern_ca.pub:ro

  demo-b:
    build: ./target
    volumes:
      - ./.state/keys/ca_ed25519.pub:/etc/ssh/postern_ca.pub:ro

volumes:
  db-data:
