# postern hedefleri.
#
# ansible_user: hedefte SUDO YETKİSİ OLAN hesap. postern'in açacağı
# hesap değil — bu rol sshd'yi yapılandırıyor, oturum açmıyor.
#
# ⚠️ ADRESLER VE HESAP YER TUTUCU. Burada bir süre gerçek bir
# laboratuvarın adları, sekiz gerçek IP'si ve gerçek bir hesap adı
# duruyordu — ve bu dosya her sürüm arşivinin içinde gidiyor. Örneği
# olduğu gibi koşan biri başkasının makinelerine bağlanmayı denerdi.
# CHANGE_ME olarak bırakılan değerler deploy/README.md'nin anlattığı
# değerler.
[postern_targets]
target-01  ansible_host=CHANGE_ME
target-02  ansible_host=CHANGE_ME

[postern_targets:vars]
ansible_user=CHANGE_ME
ansible_python_interpreter=auto_silent
