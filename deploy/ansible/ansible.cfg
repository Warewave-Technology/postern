# ⚠️ ROL YOLU BURADA YAZILI OLMAK ZORUNDA.
#
# Ansible rolleri OYNATMA KİTABININ dizinine göre arıyor, çalışılan
# dizine göre değil. Örnek kitap example/ altında, rol ise roles/
# altında — yani README'nin verdiği komut rolü hiç bulamıyordu ve
# doğrulama assert'ine ulaşmadan, "role 'postern_target' was not found"
# diyerek düşüyordu. Belgede yazan tek koşum yolu buydu.
[defaults]
roles_path = ./roles
