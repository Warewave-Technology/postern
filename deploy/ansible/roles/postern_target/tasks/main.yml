---
# ⚠️ ÖNCE DOĞRULA, SONRA YAZ.
#
# Bu rol sshd'nin kimlik doğrulamasına dokunuyor. Yarım bırakılmış bir
# koşu — CA yazılmış ama principal dosyaları yazılmamış, ya da tersi —
# hedefi kimsenin giremediği bir hâlde bırakır. Zorunlu girdiler en
# başta kontrol ediliyor ki rol hiç başlamasın.
- name: postern CA public key must be provided
  ansible.builtin.assert:
    that:
      - postern_ca_pubkey | length > 0
      - postern_ca_pubkey is search('^(ssh|ecdsa)-')
    fail_msg: >-
      postern_ca_pubkey is empty or not a public key. Take it from
      `postern ca init` on the bastion. Running without it would leave this
      host trusting no CA at all, which looks like success and is not.

- name: Trust the postern certificate authority
  ansible.builtin.copy:
    content: "{{ postern_ca_pubkey | trim }}\n"
    dest: "{{ postern_ca_path }}"
    owner: root
    group: root
    # ⚠️ 0644: sshd bunu okuyor ve içeriği zaten AÇIK anahtar. Gizlemek
    # bir şey korumaz, ama yazılabilir olması her şeyi kaybettirir.
    mode: "0644"
  notify: Reload sshd

- name: Create the principals directory
  ansible.builtin.file:
    path: "{{ postern_principals_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Write the principals each account accepts
  ansible.builtin.copy:
    content: "{{ item.value | join('\n') }}\n"
    dest: "{{ postern_principals_dir }}/{{ item.key }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ postern_principals | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  notify: Reload sshd

# ⚠️ AYRI BİR DOSYAYA YAZIYORUZ, sshd_config'i DÜZENLEMİYORUZ.
#
# Ana dosyayı satır satır düzenleyen bir rol, elle yapılmış
# değişikliklerle çakışır ve iki koşu arasında ne olduğu anlaşılmaz
# olur. Ayrı dosya, geri almayı da tek bir silmeye indiriyor.
- name: Point sshd at the CA and the principals files
  ansible.builtin.template:
    src: 50-postern.conf.j2
    dest: "{{ postern_sshd_config }}"
    owner: root
    group: root
    mode: "0644"
    # ⚠️ BOZUK BİR YAPILANDIRMA YAZILMIYOR. sshd -t geçmezse dosya
    # hiç yerine konmuyor: geçersiz bir sshd_config, bir sonraki
    # yeniden başlatmada sunucuyu tamamen açılamaz yapar ve o makineye
    # bir daha SSH ile girilemez.
    validate: "sshd -t -f %s"
  notify: Reload sshd

- name: Check that sshd will accept the whole configuration
  ansible.builtin.command: sshd -t
  changed_when: false

# ⚠️ DROP-IN'İN OKUNDUĞUNU DOĞRULA — OKUNMADIĞI HÂLİ ÖLÇÜLDÜ.
#
# sshd_config.d ancak ana dosyada bir `Include` satırı varsa okunuyor ve
# o satır OpenSSH 8.2 ile geldi. RHEL 8 türevlerinde (Alma/Rocky/Oracle)
# ve Amazon Linux 2'de stok sshd_config'de Include YOK — ölçüldü,
# `grep -c '^[[:space:]]*Include' /etc/ssh/sshd_config` -> 0.
#
# O hâlde rol dosyayı yazıyor, `sshd -t -f dosya` geçiyor, `sshd -t`
# geçiyor ve oynatma kitabı "changed, failed=0" diyor — ama sshd o
# dosyayı hiç okumuyor: `sshd -T` çıktısında trustedusercakeys none.
# Yani hedef hiçbir CA'ya güvenmiyor ve ilk bağlanan kişi "Permission
# denied (publickey)" alıyor. deploy/README.md'nin rolün ENGELLEDİĞİNİ
# söylediği arızanın kendisi: "başarılı bir koşum gibi görünür ve
# öyle değildir".
#
# ⚠️ ANAHTARIN VARLIĞINA DEĞİL DEĞERİNE BAKILIYOR — İLK HÂLİ ÖLÜ KODDU.
# Bu yoklama `grep '^trustedusercakeys'` idi. sshd -T yönerge hiç yokken
# de satırı basıyor ("trustedusercakeys none"), grep 0 dönüyor ve
# aşağıdaki ana dosya yazımı YAZILMASI GEREKEN DURUMDA BİLE hiç koşmuyordu.
# Ölçüldü, OpenSSH 9.7p1: yönerge yokken grep rc=0, değer eşleşmesi rc=1.
- name: Find out whether sshd actually reads the drop-in
  ansible.builtin.shell: >-
    set -o pipefail && sshd -T 2>/dev/null |
    awk -v want='{{ postern_ca_path }}'
    'tolower($1) == "trustedusercakeys" && $2 == want { found = 1 } END { exit !found }'
  args:
    executable: /bin/bash
  register: postern_dropin_effective
  changed_when: false
  failed_when: false

# ⚠️ DROP-IN OKUNMUYORSA YÖNERGELER ANA DOSYAYA YAZILIYOR — Include
# ONARIMI DEĞİL. İlk hâl ana dosyaya bir `Include` satırı ekliyordu.
# Ölçüldü: Amazon Linux 2'nin OpenSSH 7.4'ü Include'ı tanımıyor
# ("Bad configuration option"), validate düşüyor ve onarım o makinede
# hiç çalışamıyor; Rocky 8'in 8.0p1'i tanıyor ama stok dosyada satır yok.
# İki yönergeyi ana dosyanın BAŞINA yazmak her sürümde çalışıyor: OpenSSH
# çoğu anahtar için İLK değeri alıyor, dolayısıyla üstte duran blok
# aşağıdaki her şeyi ezer. İşaretli blok ikinci koşuda yeniden yazılmıyor,
# değer değişirse güncelleniyor.
- name: Put the directives in sshd_config itself where the drop-in is not read
  ansible.builtin.blockinfile:
    path: /etc/ssh/sshd_config
    marker: "# {mark} postern — managed by deploy/ansible/roles/postern_target"
    insertbefore: BOF
    block: |
      TrustedUserCAKeys {{ postern_ca_path }}
      AuthorizedPrincipalsFile {{ postern_principals_dir }}/%u
    owner: root
    group: root
    mode: "0600"
    # Aynı kural: geçmeyen bir yapılandırma ANA dosyaya da yazılmıyor.
    validate: "sshd -t -f %s"
  when: postern_dropin_effective.rc != 0
  notify: Reload sshd

# ⚠️ SON SÖZÜ sshd'nin KENDİSİ SÖYLÜYOR. Yukarıdaki adımların hepsi
# "yazdım" diyor; bu adım "sshd okuyor" diyor. Aradaki fark, bu rolün
# sessizce hiçbir şey yapmadığı hâlin tamamı.
- name: Confirm sshd is really trusting the postern CA
  ansible.builtin.shell: >-
    set -o pipefail && sshd -T 2>/dev/null | grep -i '^trustedusercakeys'
  args:
    executable: /bin/bash
  register: postern_ca_effective
  changed_when: false
  failed_when: postern_ca_path not in postern_ca_effective.stdout

# ⚠️ PRINCIPAL DOSYASI DA sshd'YE SORULUYOR — VE ONSUZ YÖNETİM HESABI
# BİR KİŞİYE AÇILIYOR. ÖLÇÜLDÜ.
#
# Yukarıdaki kontrol yalnızca CA'nın okunduğunu kanıtlıyordu. Oysa hesap
# ile principal'ı ayıran şey AuthorizedPrincipalsFile: etkin değilse sshd
# giriş adını sertifikanın principal listesinde arıyor. Entegrasyon
# fikstüründe bu satır kaldırıldığında, principal'ı "postern" olan bir
# sertifika parolasız root tutan yönetim hesabını AÇTI
# (test/integration/manage_test.go). OpenSSH çoğu anahtar için İLK değeri
# alıyor; ana dosyada ya da daha önce sıralanan bir drop-in'de başka bir
# AuthorizedPrincipalsFile varsa bizimki sessizce yok sayılır. Yazmak
# yetmiyor, sshd'nin gerçekten bu değeri kullandığını görmek gerekiyor.
- name: Confirm sshd is really using the postern principals files
  ansible.builtin.shell: >-
    set -o pipefail && sshd -T 2>/dev/null |
    awk -v want='{{ postern_principals_dir }}/%u'
    'tolower($1) == "authorizedprincipalsfile" && $2 == want { found = 1 } END { exit !found }'
  args:
    executable: /bin/bash
  changed_when: false
  register: postern_principals_effective
  failed_when: postern_principals_effective.rc != 0

# ───────────────────────────────────────────────────────────────────
# Yönetim hesabı (postern_manage_host)
#
# ⚠️ BURADAN SONRASI HEDEFİ POSTERN'E YÖNETTİRİYOR ve bu, yukarıdaki
# her şeyden farklı bir güven kararı. Yukarısı "bu CA'nın imzasına
# güven" diyor; burası "postern bu makinede kullanıcı açabilir, gruba
# ekleyebilir, sudoers yazabilir" diyor. Kapalıyken rolün davranışı
# birebir eskisi.
#
# ⚠️ SUDO DAR DEĞİL, VE BU BİLİNÇLİ. Dar bir kural yazsaydık, postern'in
# yapabileceklerini her genişletme ihtiyacı BÜTÜN FİLOYA bir playbook
# koşusu demek olurdu — yani hedeflerde sürümlenmesi gereken bir parça,
# yani küçük bir ajan. Geniş hak bir kez veriliyor ve bir daha
# dokunulmuyor; daraltmanın tamamı postern tarafında, sudoers
# şablonlarının doğrulanmasıyla yapılıyor.
# ───────────────────────────────────────────────────────────────────

# ⚠️ ADLAR DEĞİŞTİRİLEMEZ — İKİLİ ONLARI SABİT OLARAK TANIYOR.
#
# postern bu iki adı derleme zamanında biliyor (internal/model/manage.go):
# yönetim bağlantısını onlarla kuruyor ve aynı adları hiçbir kişiye os_user
# olarak vermiyor. Burada farklı bir değer seçmek iki şeyi birden bozardı:
# postern hedefe bağlanamazdı, ve yeni ad bir kişiye verilebilir kalırdı —
# yani parolasız root tutan hesap sıradan bir hesap gibi atanabilirdi.
- name: Refuse management names the postern binary does not recognise
  ansible.builtin.assert:
    that:
      - postern_manage_user == 'postern'
      - postern_manage_principal == 'postern-manage'
    fail_msg: >-
      postern_manage_user must be "postern" and postern_manage_principal must be
      "postern-manage". The postern binary uses these names to reach the
      management account and refuses them for people; any other value leaves
      postern unable to connect and the new name assignable to a person.
    quiet: true
  when: postern_manage_host

# ⚠️ İKİ KAYNAK ÇAKIŞMASIN. Yönetim hesabının principal dosyasını bu rol
# ayrıca yazıyor; aynı hesap postern_principals içinde de sayılmışsa
# hangisinin kazandığı koşum sırasına kalırdı. Tahmin etmek yerine
# duruyoruz.
- name: Refuse a management account that is also listed as a human target
  ansible.builtin.assert:
    that:
      - postern_manage_user not in postern_principals
    fail_msg: >-
      {{ postern_manage_user }} appears in postern_principals as well. The
      management account's principals are written by this role; listing it
      twice would make the winner depend on task order. Remove it from
      postern_principals.
  when: postern_manage_host

- name: Create the group postern manages the host as
  ansible.builtin.group:
    name: "{{ postern_manage_user }}"
    system: true
    state: present
  when: postern_manage_host

# ⚠️ PAROLA ALANI "*", "!" DEĞİL — VE ARADAKİ FARK HESABI AÇIYOR YA DA
# KAPATIYOR. useradd parolasız bir hesabı KİLİTLİ ("!") açıyor ve
# OpenSSH kilitli bir hesaba sertifikayla bile giriş vermiyor
# ("account is locked"). "*" ise parolayla girişi kapatıyor ama hesabı
# kilitlemiyor — istediğimiz tam olarak bu: giriş yalnızca sertifikayla.
- name: Create the account postern manages the host as
  ansible.builtin.user:
    name: "{{ postern_manage_user }}"
    group: "{{ postern_manage_user }}"
    system: true
    shell: "{{ postern_manage_shell }}"
    home: "{{ postern_manage_home }}"
    create_home: true
    password: "*"
  when: postern_manage_host

# ⚠️ HEDEFTE ANAHTAR YOK. Yönetim hesabına da authorized_keys
# yazmıyoruz: giriş, postern'in kendi CA'sının imzaladığı kısa ömürlü
# sertifikayla oluyor. Böylece bu hesap için çalınabilecek statik bir
# sır hiç var olmuyor.
- name: Let the management principal open the management account
  ansible.builtin.copy:
    content: "{{ postern_manage_principal }}\n"
    dest: "{{ postern_principals_dir }}/{{ postern_manage_user }}"
    owner: root
    group: root
    mode: "0644"
  when: postern_manage_host
  notify: Reload sshd

# ⚠️ visudo İLE DOĞRULANIYOR VE ASLA /etc/sudoers'A YAZILMIYOR.
# Geçersiz bir sudoers dosyası o makinede HERKESİN sudo'sunu götürür —
# postern'in kendi hesabı dahil, yani kendini onaramaz hâle gelir.
# validate, dosya yerine konmadan önce hedefin KENDİ visudo'suyla
# koşuyor: sözdizimi sudo sürümüne göre değişiyor ve bastion'da
# doğrulamak arkasını dolduramayacağımız bir iddia olurdu.
# ⚠️ AYNI SORU BİR DE YÖNETİM HESABININ BAĞLAMINDA SORULUYOR.
#
# Yukarıdaki kontrol `sshd -T` kullanıyor: o çıktı genel yapılandırmanın
# birleşimi ve Match bloklarını YOK SAYIYOR. Demo hedefinde ölçüldü —
# sshd_config'e "Match User <hesap>" altında başka bir
# AuthorizedPrincipalsFile konduğunda genel okuma eski değeri, `-C user=`
# ile okuma yeni değeri veriyor. Yani genel kontrol geçerken yönetim
# hesabının dosyası sshd'nin bakmadığı yerde olabilir; postern da aynı
# sebeple artık hesabın bağlamında okuyor (provision.PrincipalsPatternFor).
- name: Confirm sshd uses our principals file for the management account too
  ansible.builtin.shell: >-
    set -o pipefail && sshd -T -C user={{ postern_manage_user }} 2>/dev/null |
    awk -v want='{{ postern_principals_dir }}/%u'
    'tolower($1) == "authorizedprincipalsfile" && $2 == want { found = 1 } END { exit !found }'
  args:
    executable: /bin/bash
  changed_when: false
  register: postern_principals_for_manage
  failed_when: postern_principals_for_manage.rc != 0
  when: postern_manage_host

- name: Grant the management account sudo
  ansible.builtin.copy:
    content: |
      # postern — managed host account.
      #
      # Written by the postern_target Ansible role. postern narrows what
      # it actually does on this machine; this grant exists so that
      # narrowing never requires touching the fleet again.
      {{ postern_manage_user }} ALL=(ALL) NOPASSWD:ALL
    dest: "{{ postern_manage_sudoers }}"
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"
  when: postern_manage_host

# ⚠️ SON SÖZÜ sudo'nun KENDİSİ SÖYLÜYOR — sshd kontrolüyle aynı gerekçe.
# Dosyayı yazmış olmak, sudo'nun onu OKUDUĞU anlamına gelmiyor:
# sudoers.d ancak ana dosyada bir #includedir satırı varsa okunuyor ve
# bazı sıkılaştırılmış kurulumlarda o satır kaldırılmış oluyor. O hâlde
# rol "changed, failed=0" der ve postern hiçbir şey yönetemez.
- name: Confirm sudo really grants the management account
  ansible.builtin.command: sudo -n -l -U {{ postern_manage_user }}
  register: postern_sudo_effective
  changed_when: false
  failed_when: "'NOPASSWD: ALL' not in postern_sudo_effective.stdout"
  when: postern_manage_host
