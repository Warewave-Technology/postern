# postern CI.
#
# Go sürümü go.mod'dan okunuyor (go-version-file): sürümü iki yerde
# tutmak, birini güncelleyip diğerini unutmanın kolay yolu. go.mod'daki
# sürüm ayrıca bir GÜVENLİK kararı — standart kütüphane açıkları oradan
# kapanıyor, bkz. `make vuln`.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # govulncheck'in girdisi zamanla değişir: kod değişmeden yeni bir açık
  # yayımlanabilir. Haftalık koşu onu commit beklemeden yakalar.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Hızlı geri bildirim: biçim ve vet saniyeler içinde döner, testleri
  # beklemeden "gofmt unutmuşsun" demek için ayrı iş.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: make lint
      - run: make vet

  # ⚠️ Docker gerektirir: store testleri gerçek PostgreSQL'e karşı koşuyor
  # (internal/testdb). ubuntu-latest runner'ında Docker hazır geliyor.
  # -short ile atlamak MÜMKÜN ama CI'da BİLEREK yapılmıyor: yeşil bir
  # koşu, deponun gerçekten sınandığı anlamına gelmeli.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: make test-race

  # Entegrasyon ayrı iş: Keycloak, OpenLDAP ve sertifika hedefi
  # konteynerleri kalkıyor, ~5 dakika sürüyor. Birim testlerin geri
  # bildirimini bu sürenin arkasına koymamak için ayrıldı.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: make test-integration

  # gosec + govulncheck. Ayrı iş çünkü testlerden bağımsız düşebilir ve
  # düştüğünde sebebi tek bakışta görünmeli.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: make sec
      - run: make vuln

  # web/dist repoya commit'lenmiş bir derleme çıktısı (go:embed onu gömüyor,
  # böylece Go tarafını derlemek Node istemiyor). Bedeli: kaynakla
  # uyumsuz kalabilir. Bu iş onu yeniden kurup farkı olup olmadığına bakar.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make web-test
      - run: make web-check

  # Fuzz kampanyası — YALNIZCA haftalık cron'da.
  #
  # PR kapısında değil: tohum korpusu zaten her `go test` koşusunda
  # çalışıyor, yani test-race işi bütün hedefleri -race altında sınıyor.
  # Kampanyanın kendisi süreli ve rastgele; onu PR kapısına koymak
  # insanları kırmızıyı görmezden gelmeye alıştırır. -race olmadan
  # koşuyor: yarış kapsamı tohum korpusundan geliyor, kampanyanın işi
  # yeni girdi bulmak ve -race verimi yarıya düşürüyor.
  fuzz:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: make fuzz FUZZTIME=120s

  # ⚠️ ÜÇÜNCÜ TARAF BİLDİRİMLERİ KAYNAKLA UYUMLU MU. THIRD-PARTY-NOTICES.md
  # ikiliye giren modüllerden ÜRETİLİYOR ve commit'li duruyor; elle
  # tutulsaydı bir bağımlılık eklendiği gün sessizce eksik kalırdı ve
  # eksik olduğunu kimse fark etmezdi. web-check ile aynı gerekçe.
  notices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: make notices-check

  # Derlenen bir ikili üretilebiliyor mu? Testler geçerken build'in
  # kırık olması mümkün (embed edilen web/dist gibi sebeplerle).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: make build
