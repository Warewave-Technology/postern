# Elle çalıştırma için örnek config:
#   postern serve --config testdata/valid.yaml
#
# Göreli yollar bu dosyanın bulunduğu dizine göre çözülür.
# Unit test verisi ayrıdır: internal/config/testdata/
listen:
   addr: ":2222"

host_key: keys/host_ed25519

# S2: hedefe artık statik anahtarla değil, bu CA'nın kestiği kısa ömürlü
# sertifikayla bağlanılıyor. `postern ca init --key testdata/keys/ca_ed25519`
# ile üret; public satırı hedeflere `postern ca show` ile dağıt.
ca:
   key_file: keys/ca_ed25519

database:
   dsn: postgres://postern:postern@localhost:5432/postern?sslmode=disable

session:
   # Kullanıcıdan hedefe geçmesine izin verilen ortam değişkenleri.
   # Yazılmazsa varsayılan: LANG, LC_*
   # accept_env: ["LANG", "LC_*"]

   # Oturum sınırları. İKİSİ DE VARSAYILAN KAPALI.
   # idle_timeout: 30m     # iki yönde de bayt akmazsa kapat
   # max_lifetime: 12h     # mutlak ömür

recording:
   dir: recordings

# Bastion'a girişin kabul edilen yolları.
#
# public_key_login yazılmazsa AÇIK. Tamamen SSO ile çalışan bir kurumda
# kapatılabilir: kullanıcının anahtarı GELEN bacakta ve o kapı IdP'ye
# bakmıyor. Kapatıldığında sunucu publickey yöntemini teklif bile etmiyor.
# ⚠️ OIDC yapılandırılmadan kapatmak herkesi dışarıda bırakır; açılışta
# reddediliyor.
# auth:
#   public_key_login: false

# Hedefte KOMUT ÇALIŞTIRARAK tanıma. ⚠️ VARSAYILAN KAPALI.
#
# Kapalıyken postern hedef hakkında yalnızca el sıkışmadan öğrendiğini
# bilir ve makineye hiç dokunmaz. Açıldığında `uname -srm` ve
# `cat /etc/os-release`, BAĞLANAN KULLANICININ bağlantısında çalışır —
# yani hedefin günlüklerinde o kullanıcının adına görünür. Her koşu
# admin_log'a via='probe' ile yazılır. Komut listesi yapılandırılamaz.
# target_probe:
#   enabled: true
#   refresh: 24h
#   timeout: 5s

# S3.3 — tarayıcı destekli giriş (OOB). İkisi birlikte ya tam ya hiç:
# bu bloklar silinirse bastion yalnızca public key kabul eder.
http:
   addr: ":8088"
   # Tarayıcının ulaştığı kök: linkler ve redirect_url bununla kurulur.
   external_url: "http://127.0.0.1:8088"

oidc:
   issuer_url: "http://127.0.0.1:8081/realms/postern"
   client_id: "postern"

# Periyodik dizin senkronizasyonu. VARSAYILAN KAPALI.
#
# ⚠️ Açıldığında bu döngü OTOMATİK OLARAK YETKİ İPTAL EDER.
# Önce dry_run: true ile bir süre koşturup `postern sync status`
# çıktısına bakın.
# sync:
#   enabled: true
#   interval: 15m
#   grace: 1h            # dizinde bulunamadıktan sonra beklenen süre
#   dry_run: false
#   # patlama yarıçapı tavanları — aşılırsa koşu HİÇBİR ŞEY yapmadan iptal olur
#   max_zero_fraction: 0.10
#   min_zero_floor: 3
#   max_unknown_fraction: 0.25
#   max_revoke_per_run: 25
