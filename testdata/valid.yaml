# Elle çalıştırma için örnek config:
#   postern serve --config testdata/valid.yaml
#
# Göreli yollar bu dosyanın bulunduğu dizine göre çözülür.
# Unit test verisi ayrıdır: internal/config/testdata/
listen:
   addr: ":2222"

host_key: keys/host_ed25519

# S2: hedefe artık statik anahtarla değil, bu CA'nın kestiği kısa ömürlü
# sertifikayla bağlanılıyor. `postern ca init --key testdata/keys/ca_ed25519`
# ile üret; public satırı hedeflere `postern ca show` ile dağıt.
ca:
   key_file: keys/ca_ed25519

database:
   dsn: postgres://postern:postern@localhost:5432/postern?sslmode=disable

session:
   # Kullanıcıdan hedefe geçmesine izin verilen ortam değişkenleri.
   # Yazılmazsa varsayılan: LANG, LC_*
   # accept_env: ["LANG", "LC_*"]

   # Oturum sınırları. İKİSİ DE VARSAYILAN KAPALI.
   # idle_timeout: 30m     # iki yönde de bayt akmazsa kapat
   # max_lifetime: 12h     # mutlak ömür

recording:
   dir: recordings

# S3.3 — tarayıcı destekli giriş (OOB). İkisi birlikte ya tam ya hiç:
# bu bloklar silinirse bastion yalnızca public key kabul eder.
http:
   addr: ":8088"
   # Tarayıcının ulaştığı kök: linkler ve redirect_url bununla kurulur.
   external_url: "http://127.0.0.1:8088"

oidc:
   issuer_url: "http://127.0.0.1:8081/realms/postern"
   client_id: "postern"
